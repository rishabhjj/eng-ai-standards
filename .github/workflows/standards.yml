name: standards
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: pip install --quiet semgrep==1.180.0
      - run: python3 -I -m unittest discover -s scripts/tests
      - run: python3 -I scripts/standards-check.py
      - run: python3 -I scripts/vendor.py verify
      - run: scripts/test-semgrep-rules.sh
      # scripts/validate-plugin.sh needs the claude CLI, which is not available in CI; run it locally.
